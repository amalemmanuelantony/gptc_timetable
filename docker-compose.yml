services:
  web:
    build: .
    container_name: timetable-web
    restart: unless-stopped
    ports:
      - "8090:80"
    environment:
      DB_HOST: mysql
      DB_NAME: ${MYSQL_DATABASE:-timetable_db}
      DB_USER: ${MYSQL_USER:-timetable_user}
      DB_PASS: ${MYSQL_PASSWORD:-timetable_dev_password}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./:/var/www/html

  mysql:
    image: mysql:8.4
    container_name: timetable-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_password_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-timetable_db}
      MYSQL_USER: ${MYSQL_USER:-timetable_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-timetable_dev_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: timetable-phpmyadmin
    restart: unless-stopped
    ports:
      - "8091:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 32M
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:

